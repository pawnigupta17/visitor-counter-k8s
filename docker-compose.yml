
services:
  redis:
    image: redis:7-alpine
    container_name: visitor-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: visitor-web
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLUSTER_NAME=docker-compose
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
