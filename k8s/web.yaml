
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor-web
  labels:
    app: visitor-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visitor-web
  template:
    metadata:
      labels:
        app: visitor-web
    spec:
      containers:
        - name: web
          image: visitor-counter:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: CLUSTER_NAME
              value: private-cloud
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: visitor-web
spec:
  type: NodePort
  selector:
    app: visitor-web
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080